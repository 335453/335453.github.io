<script>

/* ---------- shaders ---------- */
const VS=`#version 300 es
precision highp float;
in vec2 c;in vec3 p,d,n;in vec4 s;
uniform mat4 vp;uniform vec3 cam;uniform vec2 res,jit;uniform float f,time,nbMax;uniform vec4 grp[3],sc;

 vec4 g=grp[int(G)-1];float cy=cos(g.w),sy=sin(g.w);

vbn=clamp(exp2(floor(log2(max(wpx,1.)/1.5))),2.,nbMax);
}`;
const FS=`#version 300 es
precision highp float;
in vec2 vuv;in vec3 vn,vd,vw;in float vseed,vpal,vfade,vbn,vgrp;
uniform vec3 uLit[20],uShd[20],L;
out vec4 o;
float hh(float x){return fract(sin(x*12.9898+78.233)*43758.5453);}
float h2(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}

vec3 ks(vec3 R){R=clamp(R,.02,1.);return (1.-R)*(1.-R)/(2.*R);}

 if(h2(gl_FragCoord.xy+vseed*97.)>vfade)discard;

['c88a3a','4a2a24'],['7a4a22','20141c'],['7a7a2a','14281e'],['8a5a2a','1e1424'],['2a3a8a','080a1a'],['e8c070','4a3a4a'],['101840','050610'],['6a7ab0','2a2a60'],['8a6a90','3a2a58'],['f0d8a0','6a3a40'],['3a9a50','0a3028'],['b07a80','4a2a50']];

const LAYERS=[
[.27,(g,z)=>{const e=Math.pow(R(),1.25)*1.45,ph=R()*6.2832,Rr=380,ce=Math.cos(e),px=Rr*ce*Math.cos(ph),py=Rr*Math.sin(e),pz=Rr*ce*Math.sin(ph);
 const v=e*6+.4*Math.sin(ph*3+e*4)+.25*Math.sin(ph*7-e*9),pal=[0,1,2,3,4,1][((Math.floor(v)%6)+6)%6];

[.17,(g,z)=>{const t=-30+R()*180,s=-3.2-Math.pow(R(),1.3)*70,y=hillH(t,s),e=.5;
 const dt=(hillH(t+e,s)-hillH(t-e,s))/(2*e),ds=(hillH(t,s+e)-hillH(t,s-e))/(2*e),w=Math.sin(t*.15+s*.3),p=W(t,s,y);
 Em(p[0],p[1],p[2],D[0]+.3*w*S[0],dt,D[2]+.3*w*S[2],-dt*D[0]-ds*S[0],1,-dt*D[2]-ds*S[2],3*z,.7*z,[10,11,18][Math.floor((.5+.5*w)*2.99)],g,0)}],
[.11,(g,z)=>{let t;do{t=R()*120}while(inGap(t));const s=(R()*2-1)*2.2;let pal=Math.sin(t*1.3+s*.9)>0?8:9;if(Math.abs(s)>1.9&&R()<.4)pal=7;

[.04,(g,z)=>{const i=Math.floor(R()*41),sg=R()<.5?-1:1,t=i*3;if(sg>0&&t>=60&&t<=66)return;

[.03,(g,z)=>{const t=R()*120,sg=R()<.5?-1:1,low=R()<.6,p=W(t,sg*(low?2.25:2.3),low?.04:1.12);Em(p[0],p[1],p[2],D[0],0,D[2],0,1,0,2,.045,14,2,0)}],
[.03,(g,z)=>{const t=-20+R()*140,s=-4-R()*5,y=hillH(t,s)+.4,a=R()*6.2832,p=W(t,s,y);
 Em(p[0],p[1],p[2],.15*Math.cos(a),1,.15*Math.sin(a),Math.cos(a),.2,Math.sin(a),.9*z,.04*z,R()<.6?18:10,g,0)}]
];
let genTok=0,nDraw=0,flushed=0,vb,vao;
function flush(){const n=idx-flushed;if(n<=0)return;gl.bindBuffer(gl.ARRAY_BUFFER,vb);
 gl.bufferSubData(gl.ARRAY_BUFFER,flushed*ST*4,buf.subarray(flushed*ST,idx*ST));flushed=idx;nDraw=idx}
async function generate(){
 const tok=++genTok,T=TIERS[tierName];cap=T.n;nDraw=0;idx=0;flushed=0;R=mb(1337);
 buf=new Float32Array(cap*ST);gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,cap*ST*4,gl.DYNAMIC_DRAW);
 let done=0;
 for(const [share,fn] of LAYERS){const q=Math.floor(share*cap);
  for(let i=0;i<q;){const t0=performance.now();
   while(i<q&&performance.now()-t0<12){const rr=R(),g=rr<.4?0:rr<.8?1:2;fn(g,[1.6,1,.62][g]);i++;done++}
   flush();$('bar').style.width=(100*done/cap)+'%';
   await new Promise(r=>setTimeout(r,0));if(tok!==genTok)return}}

}
vb=gl.createBuffer();vao=gl.createVertexArray();gl.bindVertexArray(vao);
const cb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,cb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,-1,0,1,1,-1,1,1]),gl.STATIC_DRAW);
const A=n=>gl.getAttribLocation(pS,n);

gl.bindBuffer(gl.ARRAY_BUFFER,vb);
[['p',3,0],['d',3,12],['n',3,24],['s',4,36]].forEach(([n,k,o])=>{const l=A(n);gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,k,gl.FLOAT,false,ST*4,o);gl.vertexAttribDivisor(l,1)});
const pvao=gl.createVertexArray();

/* ---------- math ---------- */
const mul=(a,b)=>{const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o};

const crs=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];

const hal=(i,b)=>{let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b)}return r};

/* ---------- framebuffers ---------- */
let FB={w:0,h:0};
const mkTex=(w,h)=>{const t=gl.createTexture();gl.bindTexture(3553,t);gl.texImage2D(3553,0,gl.RGBA8,w,h,0,gl.RGBA,gl.UNSIGNED_BYTE,null);

const tfb=t=>{const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,3553,t,0);return f};
function mkFB(w,h){

 const sm=Math.min(TIERS[tierName].ms,gl.getParameter(gl.MAX_SAMPLES));
 FB.rc=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,FB.rc);gl.renderbufferStorageMultisample(gl.RENDERBUFFER,sm,gl.RGBA8,w,h);

 gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,FB.rc);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,FB.rd);
 FB.ts=mkTex(w,h);FB.rs=tfb(FB.ts);FB.ta=mkTex(w,h);FB.ac=tfb(FB.ta);FB.w=w;FB.h=h;FB.n=0}

/* ---------- state / input ---------- */
const keys={};let yaw=3.2,pitch=.12,dist=9,scale=1,photo=false,tour=false,hud=true,T=0,over=null;
let manualUntil=0,scT=-1,accN=0,still=0,frozen=null,lastKey='',joy=[0,0],jumpReq=false;
const P={t:3,s:0,y:0,vy:0,dir:1,safe:3,h:0,mx:0,mz:0};
let physics='loading';
const rap=Promise.race([import('https://cdn.skypack.dev/@dimforge/rapier3d-compat').then(()=>'Rapier loaded (sim uses fallback)'),new Promise((_,j)=>setTimeout(()=>j(0),4000))]);
rap.then(r=>physics=r).catch(()=>physics='fallback physics');
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(k==' ')e.preventDefault();
 if(k=='e')scream();if(k=='t')tour=!tour;if(k=='p')photo=!photo;if(k=='h')hud=!hud});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function scream(){scT=T;manualUntil=0}
$('bT').onclick=()=>tour=!tour;$('bP').onclick=()=>photo=!photo;$('bH').onclick=()=>hud=!hud;$('bS').onclick=scream;
$('bSc').onpointerdown=scream;$('bJ').onpointerdown=()=>jumpReq=true;
$('tier').onchange=e=>{tierName=e.target.value;FB.w=0;flushed=0;generate()};
const ptr=new Map();let pd=0;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);pd=0};
cv.onpointermove=e=>{if(!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);
 if(ptr.size==2){const q=[...ptr.entries()].map(x=>x[1]),d0=Math.hypot(q[0][0]-q[1][0],q[0][1]-q[1][1]);ptr.set(e.pointerId,[e.clientX,e.clientY]);
  const q2=[...ptr.values()],d1=Math.hypot(q2[0][0]-q2[1][0],q2[0][1]-q2[1][1]);dist=Math.min(30,Math.max(3,dist*d0/Math.max(d1,1)));return}
 yaw-=(e.clientX-o[0])*.005;pitch=Math.max(-.2,Math.min(1.1,pitch+(e.clientY-o[1])*.004));ptr.set(e.pointerId,[e.clientX,e.clientY])};
cv.onpointerup=cv.onpointercancel=e=>ptr.delete(e.pointerId);
cv.addEventListener('wheel',e=>{dist=Math.min(30,Math.max(3,dist*Math.exp(e.deltaY*.001)));e.preventDefault()},{passive:false});
const jy=$('joy');let jp=null;
jy.onpointerdown=e=>{jp=e.pointerId;jy.setPointerCapture(jp);jm(e)};jy.onpointermove=e=>{if(e.pointerId==jp)jm(e)};
jy.onpointerup=jy.onpointercancel=()=>{jp=null;joy=[0,0];$('knob').style.transform=''};
function jm(e){const r=jy.getBoundingClientRect();let x=(e.clientX-r.left-55)/45,y=(e.clientY-r.top-55)/45;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}joy=[x,-y];$('knob').style.transform=`translate(${x*35}px,${y*35}px)`}

/* ---------- simulation ---------- */
function update(dt){
 const fx=Math.sin(yaw),fz=Math.cos(yaw);let ix=(keys.d?1:0)-(keys.a?1:0)+joy[0],iz=(keys.w?1:0)-(keys.s?1:0)+joy[1];
 let mx=fx*iz+fz*ix,mz=fz*iz-fx*ix;const man=Math.hypot(ix,iz)>.1;if(man)manualUntil=T+4;
 let sp=keys.shift?6.5:3.2;
 if(!man&&T>manualUntil&&!tour&&!photo&&!over){mx=D[0]*P.dir;mz=D[2]*P.dir;sp=4.2;
  if(inGap(P.t+P.dir*1.9)&&P.y<=0)P.vy=8;
  if(P.t>118)P.dir=-1;if(P.t<2)P.dir=1}
 else if(!man){mx=0;mz=0}
 else{const l=Math.hypot(mx,mz)||1;mx/=l;mz/=l}
 if(over)return;
 if(mx||mz){P.mx=mx;P.mz=mz}
 P.t=Math.max(.3,Math.min(119.7,P.t+(mx*D[0]+mz*D[2])*sp*dt));
 let ns=P.s+(mx*S[0]+mz*S[2])*sp*dt;
 const rg=P.t>60&&P.t<66&&ns>0;if(Math.abs(ns)>2.15&&P.y<1&&!rg&&Math.abs(P.s)<=2.2)ns=Math.sign(ns)*2.15;P.s=ns;
 if((keys[' ']||jumpReq)&&P.y<=0&&P.vy<=0)P.vy=8;jumpReq=false;
 const deck=Math.abs(P.s)<=2.2&&!inGap(P.t);
 P.vy-=22*dt;P.y+=P.vy*dt;
 if(P.y<=0&&P.vy<=0&&deck){P.y=0;P.vy=0;P.safe=Math.max(2,P.t-(inGap(P.t+2)?1.5:0))}
 if(P.y<-5){P.t=P.safe;P.s=0;P.y=0;P.vy=0}
}
const SHOTS={wide:[W(-4,0,3.2),W(60,0,3.5)],close:[W(10,.5,.9),W(10.5,.55,.4)],prot:[W(6.2,.5,1.3),W(3,0,1.4)],sky:[W(5,0,1.7),null],tour:null,mobile:[W(-2,0,3),W(60,0,3.5)]};
window.__shot=id=>new Promise(res=>{over=id=='tour'?{tour:.35}:id=='sky'?{p:SHOTS.sky[0],look:[SHOTS.sky[0][0]+D[0]*100,40,SHOTS.sky[0][2]+D[2]*100]}:{p:SHOTS[id][0],look:SHOTS[id][1]};
 P.t=3;P.s=0;P.y=0;P.vy=0;accN=0;let n=0;const w=()=>{if(++n>4)res(id);else requestAnimationFrame(w)};requestAnimationFrame(w)});
window.__free=()=>{over=null};

/* ---------- frame ---------- */
const hudEl=$('hud');let last=performance.now(),fpsA=60,lowN=0,hiN=0,hT=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-last)/1000);last=now;fpsA+=(1/Math.max(dt,1e-4)-fpsA)*.05;
 if(!(photo&&still>.5))T+=dt;
 update(dt);
 // camera
 let cp,f,aspect=cv.width/cv.height;
 const px=W(P.t,P.s,P.y);
 if(over&&over.p){cp=over.p;f=nrm([over.look[0]-cp[0],over.look[1]-cp[1],over.look[2]-cp[2]])}
 else if(tour||over){const ph=over?over.tour:(T*.025)%1;cp=W(8+ph*100,3*Math.sin(ph*12.57)+1.2,2+1.5*Math.sin(ph*18.85));const l=W(38+ph*100,0,3+3*Math.sin(ph*9));f=nrm([l[0]-cp[0],l[1]-cp[1],l[2]-cp[2]])}
 else{f=[Math.sin(yaw)*Math.cos(pitch),-Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)];cp=[px[0]+0-f[0]*dist,px[1]+1.2-f[1]*dist,px[2]-f[2]*dist]}
 // resolution
 const Tq=TIERS[tierName],dpr=Math.min(devicePixelRatio||1,Tq.dpr);
 const cw=Math.floor(innerWidth*dpr),ch=Math.floor(innerHeight*dpr);if(cv.width!=cw||cv.height!=ch){cv.width=cw;cv.height=ch}
 aspect=cw/ch;const sw=Math.max(64,Math.floor(cw*scale)),sh=Math.max(64,Math.floor(ch*scale));
 if(FB.w!=sw||FB.h!=sh)mkFB(sw,sh);
 // scale hysteresis
 if(fpsA<38){if(++lowN>60){scale=Math.max(.6,+(scale-.1).toFixed(2));lowN=0}}else lowN=0;
 if(fpsA>57&&scale<1){if(++hiN>240){scale=Math.min(1,+(scale+.1).toFixed(2));hiN=0}}else hiN=0;
 const proj=persp(1.05,aspect,.1,1500),vp=mul(proj,viewR(f));
 const key=[...cp,...f,P.t,P.s,P.y,scT].map(x=>x.toFixed(4)).join();
 if(key!==lastKey||!photo){still=0;accN=0;lastKey=key}else still+=dt;
 // figure/npc transforms
 const toC=Math.atan2(cp[0]-px[0],cp[2]-px[2]),mv=Math.atan2(P.mx,P.mz),h=Math.atan2(Math.sin(mv)*.35+Math.sin(toC)*.65,Math.cos(mv)*.35+Math.cos(toC)*.65);
 const nt=70+30*(.5+.5*Math.sin(T*.05)),a=W(nt,.7,0),b=W(nt+3,-.6,0),hn=Math.atan2(D[0],D[2]);
 const grp=new Float32Array([px[0],px[1]+(Math.abs(Math.sin(T*9))*.03),px[2],h,a[0],0,a[2],hn,b[0],0,b[2],hn]);
 let jit=[0,0],wgt=1,draw=true;
 if(photo&&still>.5){if(accN<32){jit=[hal(accN+1,2)-.5,hal(accN+1,3)-.5];accN++;wgt=1/accN}else draw=false}
 if(draw){
  gl.bindFramebuffer(gl.FRAMEBUFFER,FB.ms);gl.viewport(0,0,sw,sh);gl.clearColor(.52,.46,.38,1);gl.clearDepth(1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);gl.useProgram(pS);gl.bindVertexArray(vao);
  gl.uniformMatrix4fv(U.vp,false,vp);gl.uniform3fv(U.cam,cp);gl.uniform2f(U.res,sw,sh);gl.uniform2fv(U.jit,jit);gl.uniform1f(U.f,proj[5]);
  gl.uniform1f(U.time,T);gl.uniform1f(U.nbMax,Tq.bn);gl.uniform4fv(U.grp,grp);
  const sp=W(P.t,P.s,P.y+1.6);gl.uniform4f(U.sc,sp[0],sp[1],sp[2],scT);
  gl.uniform3fv(U.uLit,PL);gl.uniform3fv(U.uShd,PS);gl.uniform3fv(U.L,nrm([D[0],.3,D[2]]));
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,nDraw);
  gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);gl.disable(gl.DEPTH_TEST);
  gl.bindFramebuffer(gl.READ_FRAMEBUFFER,FB.ms);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,FB.rs);
  gl.blitFramebuffer(0,0,sw,sh,0,0,sw,sh,gl.COLOR_BUFFER_BIT,gl.NEAREST);
  gl.bindFramebuffer(gl.FRAMEBUFFER,FB.ac);gl.viewport(0,0,sw,sh);gl.useProgram(pP);gl.bindVertexArray(pvao);
  gl.enable(gl.BLEND);gl.blendColor(0,0,0,wgt);gl.blendFunc(gl.CONSTANT_ALPHA,gl.ONE_MINUS_CONSTANT_ALPHA);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(3553,FB.ts);gl.uniform1i(UT,0);gl.drawArrays(gl.TRIANGLES,0,3);gl.disable(gl.BLEND);
 }
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,cw,ch);gl.useProgram(pP);gl.bindVertexArray(pvao);
 gl.bindTexture(3553,FB.ta);gl.uniform1i(UT,0);gl.drawArrays(gl.TRIANGLES,0,3);
 hT+=dt;if(hT>.25){hT=0;hudEl.style.display=hud?'block':'none';
  hudEl.textContent=`FPS ${fpsA.toFixed(0)}\nstrokes ${nDraw.toLocaleString()}\ntier ${tierName}  scale ${scale}\nphysics: ${physics}${photo?'\nphoto '+accN+'/32':''}`}
}
generate();requestAnimationFrame(frame);
