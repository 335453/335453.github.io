function flowers(){const Fd=nz([1,0,.5]),hn=nz([Fd[0],-.35,Fd[2]]);for(let i=0;i<cN(1300);i++){const r=Math.sqrt(R()<.55?rr(9,676):rr(1156,2116)),a=rr(0,6.2832),x=r*Math.cos(a),z=r*Math.sin(a);if(Math.abs(r-RING)<3.2)continue;

 for(let b=0;b<4;b++){const f=b*Math.PI/2,a=[0,Math.cos(f),Math.sin(f)],sd2=[0,-Math.sin(f),Math.cos(f)];for(let i=0;i<cN(500);i++){const u=rr(.8,7),v=i%3?rr(.2,1.4):rr(-.1,.1);S(add(mul(a,u),mul(sd2,v)),a,[1,0,0],[.25,.2,.2],i%3?[.85,.8,.65]:[.4,.3,.25],.2,6)}}
