<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>TheGleaners</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<style>
:root{--bg:#2a1d14;--fg:#f6e6c0;--pn:rgba(30,18,10,.62)}

#ui{right:8px;top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:6px;flex-wrap:wrap;max-width:60vw;justify-content:flex-end}

#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#e0b050;opacity:.85}
#acts{display:none;position:fixed;right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 28px);gap:12px}
#acts button{width:70px;height:70px;border-radius:50%;font-size:13px}
body.touch #joy{display:block}body.touch #acts{display:flex}
#msg{left:50%;bottom:8px;transform:translateX(-50%);opacity:.8;font-size:11px;text-align:center}

<script>
'use strict';
/* ===================== WORKER: stroke generation ===================== */
function W(){

const q=v=>(Math.round(Math.max(-1,Math.min(1,v))*127))&255;
function begin(ox,oy,oz,rad,max,kind){cur={ox,oy,oz,rad,kind,k:0,mx:max,f:new Float32Array(max*4),u:new Uint8Array(max*12)}}

 const c=cur;if(c.k>=c.mx)return;const i=c.k++,f=c.f,u=c.u;
 f[i*4]=x-c.ox;f[i*4+1]=y-c.oy;f[i*4+2]=z-c.oz;f[i*4+3]=len;
 let a=Math.hypot(nx,ny,nz)||1;nx/=a;ny/=a;nz/=a;a=Math.hypot(dx,dy,dz)||1;dx/=a;dy/=a;dz/=a;
 const j=i*12;u[j]=q(dx);u[j+1]=q(dy);u[j+2]=q(dz);u[j+3]=Math.round(Math.min(1,wr)*127);
 u[j+4]=q(nx);u[j+5]=q(ny);u[j+6]=q(nz);u[j+7]=fig+1;u[j+8]=pal;u[j+9]=gen;u[j+10]=ex;u[j+11]=(rnd()*255)|0;
}
function flush(){const c=cur;done++;postMessage({o:[c.ox,c.oy,c.oz],r:c.rad,k:c.kind,n:c.k,f:c.f.slice(0,c.k*4),u:c.u.slice(0,c.k*12),p:done/TOTAL});cur=null}
const GL=[1.6,1,.62];
const pickG=()=>{const r=rnd();return r<.2?0:r<.55?1:2};
const pickS=()=>{const r=rnd();return r<.55?0:r<.85?1:2};
// ellipsoid shell. mode 0: flow vertical along surface, 1: around, 2: along x, 3: along z
function ell(cx,cy,cz,rx,ry,rz,n,pal,fig,mode,ex,yMin,lenMul){

 for(let i=0;i<n;i++){
  const z=rnd()*2-1,a=rnd()*TAU,r=Math.sqrt(1-z*z),ux=r*Math.cos(a),uy=z,uz=r*Math.sin(a);

  if(Math.hypot(dx,dy,dz)<.1){dx=1;dy=0;dz=0}

 }
}
// box with yaw. flow along longer horizontal axis of face
function box(cx,cy,cz,sx,sy,sz,yaw,n,pal,fig,ex){
 const A=[sy*sz,sy*sz,sx*sy,sx*sy,sx*sz],T=A[0]*2+A[2]*2+A[4],L=Math.max(.04,Math.sqrt(T*3.2/(3.2*n))),c=Math.cos(yaw),sn=Math.sin(yaw);

  let r=rnd()*T,f=0;for(;f<5;f++){r-=A[f];if(r<0)break}f=Math.min(f,4);

  const rx=(a,b)=>[a*c+b*sn,-a*sn+b*c],P=rx(px,pz),N=rx(nx,nz),D=rx(dx,dz),g=fig<0?pickS():pickG();

}
function roof(cx,cy,cz,sx,sz,h,n,pal){

 for(let i=0;i<n;i++){const sg=rnd()<.5?-1:1,u=rnd(),nl=Math.hypot(h,sx/2),g=pickS();

}
function figure(id,n,scarf,top,cloth){
 begin(0,0,0,1e9,n+400,2);
 const sk=(n*.36)|0;
 {const y0=.05,y1=.95,r0=.44,r1=.22,L=Math.max(.02,Math.sqrt(3*1.1/(3.2*sk)));
  for(let i=0;i<sk;i++){const u=rnd(),y=y0+(y1-y0)*u,r=r0+(r1-r0)*u,a=rnd()*TAU,ca=Math.cos(a),sa=Math.sin(a),g=pickG();
   const apron=sa>.45&&Math.abs(ca)<.7;
   E(r*ca,y,r*sa,ca,(r0-r1)/(y1-y0),sa,(r1-r0)*ca,y1-y0,(r1-r0)*sa,L*GL[g]*(.8+.4*rnd()),.3,apron?16:cloth,g,id,0)}}
 ell(0,1.2,0,.21,.28,.14,(n*.22)|0,top,id,0,0);
 ell(0,1.62,.03,.1,.115,.11,(n*.06)|0,4,id,0,0);
 ell(0,1.66,-.01,.118,.125,.128,(n*.09)|0,scarf,id,0,0,1.6);
 ell(.25,1.2,.04,.06,.3,.06,(n*.05)|0,top,id,0,0);ell(-.25,1.2,.04,.06,.3,.06,(n*.05)|0,top,id,0,0);
 ell(.22,.92,.18,.05,.06,.05,(n*.01)|0,4,id,0,0);ell(-.22,.92,.18,.05,.06,.05,(n*.01)|0,4,id,0,0);

}
function horse(id,n,rider){
 begin(0,0,0,1e9,n+300,2);
 ell(0,1.15,0,.33,.38,.85,(n*.34)|0,8,id,3,0);
 ell(0,1.62,.85,.13,.38,.14,(n*.08)|0,8,id,0,0);
 ell(0,1.92,1.18,.1,.13,.3,(n*.06)|0,8,id,3,0);
 ell(0,1.1,-.92,.05,.3,.05,(n*.03)|0,12,id,0,0);
 for(const sx of[-1,1])for(const sz of[-1,1])ell(sx*.2,.5,sz*.55,.07,.5,.07,(n*.06)|0,8,id,0,sx*sz>0?50:60);
 if(rider){
  ell(0,1.58,-.05,.25,.08,.3,(n*.04)|0,14,id,3,0);
  ell(0,2.0,0,.22,.32,.17,(n*.1)|0,7,id,0,0);
  ell(0,2.43,.02,.1,.12,.1,(n*.03)|0,4,id,0,0);
  ell(0,2.52,.02,.16,.05,.16,(n*.03)|0,8,id,1,0);
  ell(.22,1.55,.1,.08,.3,.12,(n*.04)|0,8,id,0,0);ell(-.22,1.55,.1,.08,.3,.12,(n*.04)|0,8,id,0,0);
 }

}
function sky(N){
 const R=800,A=2*PI*R*R*1.06,ns=[N*.06,N*.24,N*.7],Ls=[26,12,5.5];
 const ls=Math.max(1,Math.sqrt(2.5e6/B));
 begin(0,0,0,1e9,N+10,1);
 for(let g=0;g<3;g++){const n=Math.floor(ns[g]),len=Math.max(.5,Math.sqrt(A*3/(3.2*n))),L=Math.max(len,Ls[g]*.5)*(g?1:1);
  for(let i=0;i<n;i++){const se=rnd()*1.06-.07,el=Math.asin(se),az=rnd()*TAU,ce=Math.cos(el);
   const x=R*ce*Math.cos(az),y=R*se,z=R*ce*Math.sin(az);
   E(x,y,z,-x/R,-se,-z/R,-Math.sin(az),.06*Math.sin(az*3),Math.cos(az),L*(.8+.4*rnd()),.28,20,g,-1,0)}}

}
function hills(N){
 begin(0,0,0,1e9,N+10,2);
 const H=a=>14+13*Math.sin(3*a+1)+8*Math.sin(7*a+2)+4*Math.sin(13*a);
 for(let ring=0;ring<2;ring++){
  const Rr=ring?478:432,hm=ring?1.7:1,A=2*PI*Rr*28*hm,ns=[N*.4,N*.35,N*.25].map(v=>Math.floor(v/2));
  for(let g=0;g<3;g++){const n=ns[g],L=Math.max(.8,Math.sqrt(A*3/(3.2*n)));
   for(let i=0;i<n;i++){const a=rnd()*TAU,h=Math.max(8,H(a))*hm,y=rnd()*h,r=Rr+y*.5,ca=Math.cos(a),sa=Math.sin(a),tl=y>h-5;
    E(r*ca,y,r*sa,-ca*.8,.6,-sa*.8,-sa,0,ca,L*(.8+.4*rnd())*(g?1:1.5),.3,tl&&!ring?12:3,g,-1,0)}}}

function ground(c,ls){

 begin(c.x0+CS/2,0,c.z0+CS/2,CS*.75,cnt[0]+cnt[1]+cnt[2]+nbl+4,0);
 for(let i=0;i<nbl;i++){const x=c.x0+rnd()*CS,z=c.z0+rnd()*CS;if(Math.abs(Math.hypot(x-TC.cx,z-TC.cz)-TC.R)<3.4)continue;

  for(let i=0;i<cnt[g];i++){
   const x=c.x0+rnd()*CS,z=c.z0+rnd()*CS,rr=Math.hypot(x,z);if(rr>445)continue;
   const ct=Math.hypot(x-TC.cx,z-TC.cz),dt=Math.abs(ct-TC.R);

   if(dt<3.4){pal=13;const a=Math.atan2(z-TC.cz,x-TC.cx);dx=-Math.sin(a);dz=Math.cos(a);if(Math.abs(dt-1.2)<.4&&rnd()<.5)pal=0}
   else{const ph=2.2*x+5*Math.sin(.03*z),sn=Math.sin(ph),cs=Math.cos(ph);dx=-.15*Math.cos(.03*z)+.08*Math.sin(x*.5+z*.3);dz=2.2;

  }}

}
// ---- build plan ----
const CS=32,cells=[];

// props: track fences, walls, obstacles
begin(TC.cx,0,TC.cz,TC.R+20,60000,0);

// big scenery (screen-right = -x)
const hs=Math.floor(B*.012);
const stacks=[[-78,100,8,10],[-96,128,9,11],[-70,150,7,9],[-118,112,10,12],[-100,168,8,10]];
for(const h of stacks){begin(h[0],0,h[1],h[3]*1.6,hs+50,0);ell(h[0],0,h[1],h[2],h[3],h[2],hs,9,-1,0,0,.1);flush()}

/* ===================== GLSL ===================== */
const VS=`#version 300 es

 // camera follow
 if(!S.ov&&S.auto&&S.clk-S.lastDrag>3){S.camYaw+=Math.atan2(Math.sin(S.hd-S.camYaw),Math.cos(S.hd-S.camYaw))*Math.min(1,dt*.9)}
}
function setFig(i,x,y,z,h,b,bs,sp,p,cp){const k=i*4;Fa[k]=x-cp[0];Fa[k+1]=y-cp[1];Fa[k+2]=z-cp[2];Fa[k+3]=h;Fb[k]=b;Fb[k+1]=bs;Fb[k+2]=sp;Fb[k+3]=p}
function figs(cp){
 const bs=.55+Math.min(S.count,40)*.03;
 setFig(0,ph.x,ph.y,ph.z,S.hd,S.bend,bs,S.spd||0,0,cp);
 const h1=histAt(.9),h2=histAt(1.7);
 const off=(h,l)=>[h.x+Math.cos(h.h)*l,h.z-Math.sin(h.h)*l];
 let p=off(h1,1.3);setFig(1,p[0],h1.y,p[1],h1.h,histAt(.35).b,.6,S.spd||0,1.3,cp);
 p=off(h2,-1.3);setFig(2,p[0],h2.y,p[1],h2.h,histAt(.7).b,.6,S.spd||0,2.1,cp);
 const ot=S.T*.12;setFig(3,-32+Math.sin(ot)*10,0,48+Math.cos(ot)*8,Math.atan2(Math.cos(ot)*10,-Math.sin(ot)*8)+(Math.cos(ot)>0?0:0),0,1,.6,0,cp);
 for(let i=0;i<36;i++){const l=labs[i];setFig(4+i,l.x,0,l.z,l.h,.2+.95*Math.max(0,Math.sin(S.T*(.35+.1*(l.ph%1))+l.ph*1.9)),.8,0,0,cp)}
 setFig(40,-87.4,0,106,0,0,1,.35,0,cp);setFig(41,-88.6,0,106,0,0,1,.35,1.6,cp);
}

/* ===================== camera & render ===================== */
function persp(f,a,n,fa){const t=1/Math.tan(f/2);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(fa+n)/(n-fa),-1,0,0,2*fa*n/(n-fa),0])}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o}
function viewM(yaw,pitch){
 const cp=Math.cos(pitch),f=[Math.sin(yaw)*cp,Math.sin(pitch),Math.cos(yaw)*cp];
 let r=[-f[2],0,f[0]];const rl=Math.hypot(r[0],r[2]);r=[r[0]/rl,0,r[2]/rl];
 const u=[r[1]*f[2]-r[2]*f[1],r[2]*f[0]-r[0]*f[2],r[0]*f[1]-r[1]*f[0]];
 return new Float32Array([r[0],u[0],-f[0],0,r[1],u[1],-f[1],0,r[2],u[2],-f[2],0,0,0,0,1]);
}
const halton=(i,b)=>{let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b)}return r};
let accN=0,still=0,prevCam='',lastT=0;
const FOV=52*Math.PI/180;
function getCam(){
 if(S.ov)return S.ov;
 if(S.tour){const t=S.clk,a=t*.06,rad=95+25*Math.sin(.37*t),cx=-20,cz=70;
  const px=cx+rad*Math.cos(a),pz=cz+rad*Math.sin(a),py=6+16*(.5+.5*Math.sin(.23*t));return tourCam(px,py,pz,cx+10*Math.sin(t*.1),2,cz)}
 const tgt=[ph.x,ph.y+1.25,ph.z],cp=Math.cos(S.camPitch),f=[Math.sin(S.camYaw)*cp,Math.sin(S.camPitch),Math.cos(S.camYaw)*cp];
 let p=[tgt[0]-f[0]*S.dist,Math.max(.35,tgt[1]-f[1]*S.dist),tgt[2]-f[2]*S.dist];
 return{p,yaw:S.camYaw,pitch:S.camPitch};
}
function tourCam(px,py,pz,tx,ty,tz){const dx=tx-px,dy=ty-py,dz=tz-pz;return{p:[px,py,pz],yaw:Math.atan2(dx,dz),pitch:Math.atan2(dy,Math.hypot(dx,dz))}}
const sunV=(()=>{const v=[.7,.26,.62],l=Math.hypot(...v);return v.map(x=>x/l)})();
let drawn=0;
function render(){
 mkTargets();
 const c=getCam(),key=c.p.map(v=>v.toFixed(3))+','+c.yaw.toFixed(4)+','+c.pitch.toFixed(4);
 const moved=key!==prevCam||!S.photo;prevCam=key;
 if(moved){accN=0;still=0}else still+=dtFrame;
 const accum=S.photo&&still>.5;
 if(accum&&accN>=32){present();return}
 if(!accum)accN=0;
 const asp=Wd/Hd;let P=persp(FOV,asp,.3,3000);
 if(accum&&accN>0){P[8]+=(halton(accN,2)-.5)*2/Wd;P[9]+=(halton(accN,3)-.5)*2/Hd}
 const VP=mul(P,viewM(c.yaw,c.pitch));
 gl.bindFramebuffer(gl.FRAMEBUFFER,msFBO);gl.viewport(0,0,Wd,Hd);
 gl.clearColor(.30,.2,.1,1);gl.clearDepth(1);gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.depthMask(true);gl.disable(gl.BLEND);
 gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 if(curSamples>0)gl.enable(gl.SAMPLE_ALPHA_TO_COVERAGE);
 gl.useProgram(PS);
 gl.uniformMatrix4fv(UL(PS,'uVP'),false,VP);
 gl.uniform3fv(UL(PS,'uPal'),PALF);gl.uniform3fv(UL(PS,'uSun'),sunV);
 gl.uniform1f(UL(PS,'uBr'),tier.br);gl.uniform1f(UL(PS,'uA2C'),curSamples>0?1:0);gl.uniform1f(UL(PS,'uTime'),S.T);
 gl.uniform1f(UL(PS,'uFocal'),Hd/(2*Math.tan(FOV/2)));gl.uniform1f(UL(PS,'uMin'),2.4*(Hd>1400?1.4:1));
 gl.uniform2f(UL(PS,'uCamXZ'),c.p[0],c.p[2]);
 figs(c.p);gl.uniform4fv(UL(PS,'uFa'),Fa);gl.uniform4fv(UL(PS,'uFb'),Fb);
 // frustum planes (camera-relative)
 const pl=[];for(const[i,sg]of[[0,1],[0,-1],[1,1],[1,-1],[2,1],[2,-1]]){const r=[0,1,2,3].map(k=>VP[k*4+3]+sg*VP[k*4+i]);const l=Math.hypot(r[0],r[1],r[2]);pl.push(r.map(v=>v/l))}
 drawn=0;
 for(const ch of chunks){
  let rel=ch.k===1?[0,0,0]:[ch.o[0]-c.p[0],ch.o[1]-c.p[1],ch.o[2]-c.p[2]];
  if(ch.r<1e8){let vis=true;for(const q of pl)if(q[0]*rel[0]+q[1]*rel[1]+q[2]*rel[2]+q[3]<-ch.r){vis=false;break}if(!vis)continue}
  gl.uniform3f(UL(PS,'uRel'),rel[0],rel[1],rel[2]);
  gl.bindVertexArray(ch.vao);gl.drawArraysInstanced(gl.TRIANGLE_STRIP,0,4,ch.n);drawn+=ch.n;
 }
 gl.bindVertexArray(null);gl.disable(gl.SAMPLE_ALPHA_TO_COVERAGE);
 // resolve + accumulate
 gl.bindFramebuffer(gl.READ_FRAMEBUFFER,msFBO);gl.bindFramebuffer(gl.DRAW_FRAMEBUFFER,resFBO);
 gl.blitFramebuffer(0,0,Wd,Hd,0,0,Wd,Hd,gl.COLOR_BUFFER_BIT,gl.NEAREST);
 gl.bindFramebuffer(gl.FRAMEBUFFER,accFBO);gl.disable(gl.DEPTH_TEST);
 gl.useProgram(PQ);gl.bindVertexArray(emptyVAO);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,resTex);gl.uniform1i(UL(PQ,'uT'),0);gl.uniform1i(UL(PQ,'uMode'),0);
 if(accN>0){gl.enable(gl.BLEND);gl.blendColor(0,0,0,1/(accN+1));gl.blendFunc(gl.CONSTANT_ALPHA,gl.ONE_MINUS_CONSTANT_ALPHA)}
 gl.drawArrays(gl.TRIANGLES,0,3);gl.disable(gl.BLEND);
 if(accum)accN++;else accN=0;
 present();
}
let frameNo=0;
function present(){
 gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,Wd,Hd);gl.disable(gl.DEPTH_TEST);
 gl.useProgram(PQ);gl.bindVertexArray(emptyVAO);gl.bindTexture(gl.TEXTURE_2D,accTex);gl.uniform1i(UL(PQ,'uT'),0);gl.uniform1i(UL(PQ,'uMode'),1);gl.uniform1f(UL(PQ,'uF'),frameNo++&255);
 gl.drawArrays(gl.TRIANGLES,0,3);
}

/* ===================== loop, adaptive resolution, HUD ===================== */
let dtFrame=.016,fpsA=60,lastScaleChange=0,goodT=0,hudT=0;
function frame(now){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,(now-lastT)/1000||.016);lastT=now;dtFrame=dt;
 fpsA=fpsA*.95+(1/Math.max(dt,1e-3))*.05;
 if(S.tour&&!S.photo)S.clk+=0;
 update(dt);
 if(S.tour&&!S.photo&&false)S.clk+=dt;
 render();
 // dynamic resolution (hysteresis)
 if(now-lastScaleChange>1500){
  if(fpsA<38&&scale>.6){scale=Math.max(.6,+(scale-.1).toFixed(2));lastScaleChange=now;goodT=0}
  else if(fpsA>56){goodT+=dt;if(goodT>4&&scale<1){scale=Math.min(1,+(scale+.1).toFixed(2));lastScaleChange=now;goodT=0}}else goodT=0;
 }
 hudT+=dt;if(hudT>.4&&S.hudOn){hudT=0;$('#hud').textContent=`FPS ${fpsA.toFixed(0)}  scale ${scale.toFixed(2)}\nstrokes ${drawn.toLocaleString()} / ${strokesTotal.toLocaleString()}\ntier ${tierName}  ${Wd}x${Hd}  MSAA ${curSamples}x\nphysics ${ph.mode==='rapier'?'Rapier':'fallback'}${ready?'':'  (painting…)'}\nmode ${S.tour?'tour':S.photo?'photo '+accN+'/32':S.auto?'auto':'manual'}`}
}
$('#tier').onchange=e=>{tierName=e.target.value;tier=TIERS[tierName];mkTargets();generate()};
const tg=(k)=>{if(k==='T'){S.tour=!S.tour;S.ov=null}if(k==='P'){S.photo=!S.photo;accN=0}if(k==='G'){S.auto=!S.auto;S.tour=false}if(k==='H'){S.hudOn=!S.hudOn;$('#hud').style.display=S.hudOn?'':'none'}};
$('#bT').onclick=()=>tg('T');$('#bP').onclick=()=>tg('P');$('#bA').onclick=()=>tg('G');$('#bH').onclick=()=>tg('H');
$('#bF').onpointerdown=()=>{gatherReq=true};$('#bJ').onpointerdown=()=>{jumpReq=true};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(' '===e.key){jumpReq=true;e.preventDefault()}
 if('wasd'.includes(k)&&k.length===1)keys[k]=true;if(k==='shift')keys.shift=true;if(k==='f')gatherReq=true;if('tpgh'.includes(k)&&k.length===1)tg(k.toUpperCase());S.tour&&'wasd'.includes(k)&&(S.tour=false)});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if('wasd'.includes(k)&&k.length===1)keys[k]=false;if(k==='shift')keys.shift=false});
// pointer: drag rotate, pinch zoom
const ptrs=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){const a=[...ptrs.values()];pd=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p[0],dy=e.clientY-p[1];p[0]=e.clientX;p[1]=e.clientY;
 if(ptrs.size===1){S.camYaw+=dx*.005;S.camPitch=clamp(S.camPitch+dy*.004,-1.2,.6);S.lastDrag=S.clk;S.ov=null}
 else if(ptrs.size===2){const a=[...ptrs.values()],d=Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1]);if(pd>0)S.dist=clamp(S.dist*pd/d,2.2,40);pd=d}});
const up=e=>{ptrs.delete(e.pointerId);pd=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{S.dist=clamp(S.dist*(1+e.deltaY*.001),2.2,40);e.preventDefault()},{passive:false});
// joystick
{const j=$('#joy'),k=$('#knob');let id=null;
 const mv=e=>{const r=j.getBoundingClientRect();let x=(e.clientX-r.left-60)/50,y=(e.clientY-r.top-60)/50;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}jx=x;jz=-y;k.style.left=(40+x*40)+'px';k.style.top=(40+y*40)+'px'};
 j.addEventListener('pointerdown',e=>{id=e.pointerId;j.setPointerCapture(id);mv(e)});j.addEventListener('pointermove',e=>{if(e.pointerId===id)mv(e)});
 const end=e=>{if(e.pointerId===id){id=null;jx=jz=0;k.style.left=k.style.top='40px'}};j.addEventListener('pointerup',end);j.addEventListener('pointercancel',end)}
addEventListener('resize',()=>mkTargets());

/* ===================== test hooks ===================== */
const PRESETS={
 wide:()=>({ov:{p:[14,7,-26],yaw:.12,pitch:-.1},clk:10}),
 close:()=>({ov:{p:[.4,.32,2.4],yaw:.05,pitch:-.5},clk:10}),
 hero:()=>({ov:null,clk:10}),
 sky:()=>({ov:{p:[0,2,0],yaw:-.9,pitch:.32},clk:10}),
 tour:()=>({ov:null,tour:true,clk:34}),
 mobile:()=>({ov:null,clk:10})
};
window.__shot=async(id)=>{
 const p=(PRESETS[id]||PRESETS.hero)();S.ov=p.ov;S.tour=!!p.tour;S.clk=p.clk;S.T=p.clk;S.photo=false;S.camYaw=0;S.camPitch=-.15;S.dist=6.5;
 while(!ready)await new Promise(r=>setTimeout(r,100));
 for(let i=0;i<3;i++)await new Promise(r=>requestAnimationFrame(r));
 return{id,strokes:drawn,logs:logs.slice()};
};
window.__setCam=(p,yaw,pitch)=>{S.ov={p,yaw,pitch}};
window.__stats=()=>({tier:tierName,strokes:strokesTotal,drawn,physics:ph.mode,scale,Wd,Hd,logs:logs.slice()});
mkTargets();generate();requestAnimationFrame(frame);
</script></body></html>
